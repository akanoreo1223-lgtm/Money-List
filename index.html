<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お小遣い帳</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .balance {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #ccc;
    }

    .balance h2 {
      margin: 0;
      color: #555;
      font-size: 18px;
    }

    #balance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    .form,
    .history,
    .wishlist,
    .goal {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #ccc;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }

    .income {
      color: #008000;
      font-weight: bold;
    }

    .expense {
      color: #d00000;
      font-weight: bold;
    }

    .delete {
      width: auto;
      padding: 5px 10px;
      margin: 0 0 0 10px;
      background: #999;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #888;
    }

    .wish-price {
      font-weight: bold;
      margin-right: 5px;
    }

    /* 欲しいもの集計 */
    .wish-summary {
      background: #f8f8f8;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
    }

    .summary-value {
      font-weight: bold;
    }

    #difference {
      font-size: 20px;
    }

    .positive {
      color: #008000;
    }

    .negative {
      color: #d00000;
    }

    .difference-note {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
    }

    /* 目標貯金 */
    .goal-summary {
      background: #f8f8f8;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }

    .goal-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    .goal-value {
      font-weight: bold;
    }

    .progress-area {
      margin-top: 15px;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #333;
      transition: width 0.3s;
    }

    .goal-message {
      text-align: center;
      font-weight: bold;
      margin-top: 12px;
    }

    .goal-complete {
      color: #008000;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💰 お小遣い帳</h1>

    <!-- 残高 -->
    <div class="balance">
      <h2>現在の残高</h2>
      <div id="balance">¥0</div>
    </div>

    <!-- 収入・支出 -->
    <div class="form">

      <select id="type">
        <option value="income">収入</option>
        <option value="expense">支出</option>
      </select>

      <input
        type="text"
        id="name"
        placeholder="内容（例：お小遣い、ゲームなど）"
      >

      <input
        type="number"
        id="amount"
        placeholder="金額"
        min="1"
      >

      <button onclick="addMoney()">追加する</button>

    </div>

    <!-- 履歴 -->
    <div class="history">
      <h2>📋 履歴</h2>
      <div id="history"></div>
    </div>

    <!-- 欲しいものリスト -->
    <div class="wishlist">

      <h2>🎁 欲しいものリスト</h2>

      <!-- 欲しいもの集計 -->
      <div class="wish-summary">

        <div class="summary-row">
          <span>欲しいもの総額</span>
          <span id="wishTotal" class="summary-value">
            ¥0
          </span>
        </div>

        <div class="summary-row">
          <span>現在の残高</span>
          <span id="wishBalance" class="summary-value">
            ¥0
          </span>
        </div>

        <div class="summary-row">
          <span>残高との差額</span>
          <span id="difference" class="summary-value">
            ¥0
          </span>
        </div>

        <div class="difference-note">
          ※「現在の残高 − 欲しいもの総額」で計算しています。
        </div>

      </div>

      <!-- 欲しいもの追加 -->
      <input
        type="text"
        id="wishName"
        placeholder="欲しいもの（例：ゲームソフト）"
      >

      <input
        type="number"
        id="wishPrice"
        placeholder="値段"
        min="1"
      >

      <button onclick="addWish()">
        欲しいものを追加
      </button>

      <div id="wishlist"></div>

    </div>


    <!-- 目標貯金 -->
    <div class="goal">

      <h2>🎯 目標貯金</h2>

      <div class="goal-summary">

        <div class="goal-row">
          <span>目標金額</span>
          <span id="goalAmount" class="goal-value">
            未設定
          </span>
        </div>

        <div class="goal-row">
          <span>現在の残高</span>
          <span id="goalBalance" class="goal-value">
            ¥0
          </span>
        </div>

        <div class="goal-row">
          <span>達成率</span>
          <span id="goalPercent" class="goal-value">
            0%
          </span>
        </div>

        <div class="progress-area">

          <div class="progress-bar">
            <div
              id="progress"
              class="progress"
            ></div>
          </div>

        </div>

        <div
          id="goalMessage"
          class="goal-message"
        >
          目標金額を設定してください。
        </div>

      </div>

      <input
        type="number"
        id="goalInput"
        placeholder="目標金額"
        min="1"
      >

      <button onclick="setGoal()">
        目標金額を設定
      </button>

    </div>

  </div>


  <script>

    /* =========================
       お小遣い帳
       ========================= */

    let records =
      JSON.parse(localStorage.getItem("okodukaiRecords")) || [];


    function addMoney() {

      const type =
        document.getElementById("type").value;

      const name =
        document.getElementById("name").value;

      const amount =
        Number(document.getElementById("amount").value);


      if (name === "" || amount <= 0) {

        alert("内容と金額を入力してください。");
        return;

      }


      const record = {

        type: type,
        name: name,
        amount: amount,
        date: new Date().toLocaleDateString("ja-JP")

      };


      records.push(record);

      saveData();
      display();


      document.getElementById("name").value = "";
      document.getElementById("amount").value = "";

    }


    function saveData() {

      localStorage.setItem(
        "okodukaiRecords",
        JSON.stringify(records)
      );

    }


    function calculateBalance() {

      let balance = 0;


      records.forEach(record => {

        if (record.type === "income") {

          balance += record.amount;

        } else {

          balance -= record.amount;

        }

      });


      return balance;

    }


    function display() {

      const balance =
        calculateBalance();


      document.getElementById("balance").textContent =
        "¥" + balance.toLocaleString();


      const history =
        document.getElementById("history");


      if (records.length === 0) {

        history.innerHTML =
          '<p class="empty">まだ記録がありません。</p>';

        displayWishes();
        displayGoal();

        return;

      }


      history.innerHTML = "";


      [...records].reverse().forEach((record, index) => {

        const div =
          document.createElement("div");

        div.className = "item";


        const realIndex =
          records.length - 1 - index;


        const sign =
          record.type === "income"
            ? "+"
            : "-";


        const className =
          record.type === "income"
            ? "income"
            : "expense";


        div.innerHTML = `

          <div>
            <small>${record.date}</small><br>
            ${record.name}
          </div>

          <div>

            <span class="${className}">
              ${sign}¥${record.amount.toLocaleString()}
            </span>

            <button
              class="delete"
              onclick="deleteRecord(${realIndex})"
            >
              削除
            </button>

          </div>

        `;


        history.appendChild(div);

      });


      displayWishes();
      displayGoal();

    }


    function deleteRecord(index) {

      if (confirm("この記録を削除しますか？")) {

        records.splice(index, 1);

        saveData();
        display();

      }

    }



    /* =========================
       欲しいものリスト
       ========================= */

    let wishes =
      JSON.parse(localStorage.getItem("okodukaiWishes")) || [];


    function addWish() {

      const name =
        document.getElementById("wishName").value;

      const price =
        Number(document.getElementById("wishPrice").value);


      if (name === "" || price <= 0) {

        alert("欲しいものと値段を入力してください。");
        return;

      }


      const wish = {

        name: name,
        price: price

      };


      wishes.push(wish);

      saveWishes();
      displayWishes();


      document.getElementById("wishName").value = "";
      document.getElementById("wishPrice").value = "";

    }


    function saveWishes() {

      localStorage.setItem(
        "okodukaiWishes",
        JSON.stringify(wishes)
      );

    }


    function displayWishes() {

      const list =
        document.getElementById("wishlist");


      let total = 0;


      wishes.forEach(wish => {

        total += wish.price;

      });


      document.getElementById("wishTotal").textContent =
        "¥" + total.toLocaleString();


      const balance =
        calculateBalance();


      document.getElementById("wishBalance").textContent =
        "¥" + balance.toLocaleString();


      const difference =
        balance - total;


      const differenceDisplay =
        document.getElementById("difference");


      if (difference >= 0) {

        differenceDisplay.textContent =
          "+¥" + difference.toLocaleString();

        differenceDisplay.className =
          "summary-value positive";

      } else {

        differenceDisplay.textContent =
          "-¥" + Math.abs(difference).toLocaleString();

        differenceDisplay.className =
          "summary-value negative";

      }


      if (wishes.length === 0) {

        list.innerHTML =
          '<p class="empty">まだ欲しいものがありません。</p>';

        return;

      }


      list.innerHTML = "";


      wishes.forEach((wish, index) => {

        const div =
          document.createElement("div");

        div.className = "item";


        div.innerHTML = `

          <div>
            🎁 ${wish.name}
          </div>

          <div>

            <span class="wish-price">
              ¥${wish.price.toLocaleString()}
            </span>

            <button
              class="delete"
              onclick="deleteWish(${index})"
            >
              削除
            </button>

          </div>

        `;


        list.appendChild(div);

      });

    }


    function deleteWish(index) {

      if (confirm("この欲しいものを削除しますか？")) {

        wishes.splice(index, 1);

        saveWishes();
        displayWishes();

      }

    }



    /* =========================
       目標貯金
       ========================= */

    let goalAmount =
      localStorage.getItem("okodukaiGoal");

    if (goalAmount !== null) {

      goalAmount = Number(goalAmount);

    }


    // 目標金額を設定
    function setGoal() {

      const input =
        document.getElementById("goalInput").value;


      if (input === "" || Number(input) <= 0) {

        alert("1円以上の目標金額を入力してください。");
        return;

      }


      goalAmount =
        Number(input);


      localStorage.setItem(
        "okodukaiGoal",
        goalAmount
      );


      document.getElementById("goalInput").value = "";


      displayGoal();

    }


    // 目標貯金を表示
    function displayGoal() {

      const goalDisplay =
        document.getElementById("goalAmount");

      const balanceDisplay =
        document.getElementById("goalBalance");

      const percentDisplay =
        document.getElementById("goalPercent");

      const progress =
        document.getElementById("progress");

      const message =
        document.getElementById("goalMessage");


      const balance =
        calculateBalance();


      balanceDisplay.textContent =
        "¥" + balance.toLocaleString();


      // 目標未設定
      if (goalAmount === null) {

        goalDisplay.textContent =
          "未設定";

        percentDisplay.textContent =
          "0%";

        progress.style.width =
          "0%";

        message.textContent =
          "目標金額を設定してください。";

        message.className =
          "goal-message";

        return;

      }


      goalDisplay.textContent =
        "¥" + goalAmount.toLocaleString();


      // 達成率
      let percent =
        (balance / goalAmount) * 100;


      // 表示用の達成率
      const displayPercent =
        Math.max(0, Math.min(100, percent));


      percentDisplay.textContent =
        displayPercent.toFixed(1) + "%";


      progress.style.width =
        displayPercent + "%";


      // 目標達成
      if (balance >= goalAmount) {

        message.textContent =
          "🎉 目標達成！";

        message.className =
          "goal-message goal-complete";

      } else {

        const remaining =
          goalAmount - balance;


        message.textContent =
          "あと¥" +
          remaining.toLocaleString() +
          "貯めれば目標達成！";

        message.className =
          "goal-message";

      }

    }



    /* =========================
       最初に表示
       ========================= */

    display();
    displayWishes();
    displayGoal();

  </script>

</body>
</html>
