const defs=[
["🌱","はじめの一歩","今月初めて記録する",()=>mr().length>=1],["📝","記録ビギナー","今月3件記録する",()=>mr().length>=3],["📚","中級記録マン","今月10件記録する",()=>mr().length>=10],["📖","上級記録マン","今月20件記録する",()=>mr().length>=20],["👑","記録マスター","今月30件記録する",()=>mr().length>=30],
["💰","貯金のススメ","残高が1,000円以上になる",()=>md.max>=1000],["💰","貯金ビギナー","残高が3,000円以上になる",()=>md.max>=3000],["💎","節約上手","残高が5,000円以上になる",()=>md.max>=5000],["💎","お金持ち","残高が10,000円以上になる",()=>md.max>=10000],["🤑","億万長者","残高が20,000円以上になる",()=>md.max>=20000],
["📈","最高記録更新","過去最高残高を更新する",()=>md.newHigh],["🏦","収入3回","今月3回収入を記録する",()=>mr().filter(r=>r.type=="income").length>=3],["💵","収入5,000円","今月の収入合計が5,000円以上",()=>sum(mr().filter(r=>r.type=="income"))>=5000],["🛍️","初めての支出","今月初めて支出を記録する",()=>mr().some(r=>r.type=="expense")],["🧮","支出5回","今月5回支出を記録する",()=>mr().filter(r=>r.type=="expense").length>=5],
["🧘","節約モード","1週間で支出合計を1,000円以下にする",()=>weekOK()],["🔥","7日間継続","7日連続でサイトを開く",()=>streak(7)],["🔥","14日間継続","14日連続でサイトを開く",()=>streak(14)],["👂","耳にタコができる","今日の一言を12種類以上見る",()=>md.seen.length>=12],["🏆","Sランク到達","今月Sランクになる",()=>rank()=="S"],["🥇","Aランク以上","今月Aランク以上になる",()=>["S","A"].includes(rank())],
["🎁","欲しいもの登録","欲しいものを1個登録する",()=>wishes.length>=1],["🎁","欲しいもの3個","欲しいものを3個登録する",()=>wishes.length>=3],["🛒","初購入","「買った！」を1回使う",()=>wishes.some(w=>w.bought)],["🛒","お買い物上手","「買った！」を3回使う",()=>wishes.filter(w=>w.bought).length>=3],["🔗","リンク活用","商品リンク付きの商品を登録する",()=>wishes.some(w=>w.link)],
["🎯","目標設定","目標貯金を設定する",()=>goal!==null],["🎯","目標50%","目標貯金の達成率50%以上",()=>goal!==null&&bal()/goal>=.5],["🎉","目標達成","目標貯金を達成する",()=>goal!==null&&bal()>=goal],["👑","今月の達人","今月の実績を20個以上達成する",()=>Object.keys(md.done).filter(i=>Number(i)<29).length>=20]
];
function save(){localStorage.setItem(K,JSON.stringify(records));localStorage.setItem(W,JSON.stringify(wishes));localStorage.setItem(M,JSON.stringify(months))}
function moneyValue(v){if(typeof v==="number"&&Number.isFinite(v))return v;const n=Number(String(v??"").replace(/,/g,"").trim());return Number.isFinite(n)?n:0}function bal(){return records.reduce((x,r)=>x+(r.type=="income"?moneyValue(r.amount):-moneyValue(r.amount)),0)}function sum(a){return a.reduce((x,r)=>x+moneyValue(r.amount),0)}
function mr(){return records.filter(r=>{let d=new Date(r.ts||0);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")==mk})}
function addMoney(){let type=typeEl().value,n=nameEl().value.trim(),a=+amountEl().value;if(!n||a<=0)return alert("内容と金額を入力してください。");records.push({type,name:n,amount:a,date:new Date().toLocaleDateString("ja-JP"),ts:Date.now()});save();clearFields();render();check()}
function typeEl(){return document.getElementById("type")}function nameEl(){return document.getElementById("name")}function amountEl(){return document.getElementById("amount")}
function showHistory(){let c=document.getElementById("cond").value,a=document.getElementById("qa").value,b=document.getElementById("qb").value,q=document.getElementById("q").value.toLowerCase();document.getElementById("qb").style.display=c=="range"?"block":"none";let rs=records.map((r,i)=>({...r,i})).filter(r=>{let n=+r.amount;if(q&&!r.name.toLowerCase().includes(q))return false;if(c=="eq"&&(a==""||n!=+a))return false;if(c=="gte"&&(a==""||n<+a))return false;if(c=="lte"&&(a==""||n>+a))return false;if(c=="range"&&(a==""||b==""||n<+a||n>+b))return false;return true}).reverse(),h=document.getElementById("history");h.innerHTML=rs.length?rs.map(r=>`<div class="item"><div><small>${esc(r.date)}</small><br>${esc(r.name)}</div><div><span class="${r.type=="income"?"income":"expense"}">${r.type=="income"?"+":"-"}¥${(+r.amount).toLocaleString()}</span><button class="delete" onclick="delRecord(${r.i})">削除</button></div></div>`).join(""):'<p class="empty">該当する履歴がありません。</p>'}
function delRecord(i){if(confirm("この記録を削除しますか？")){records.splice(i,1);save();render();check()}}function clearSearch(){q.value="";cond.value="all";qa.value="";qb.value="";showHistory()}
  const height = graphHeight - top - bottom;

  const getX = i =>
    left + width * i / (values.length - 1);

  const getY = value =>
    top + height * (max - value) / range;

  ctx.font = "11px sans-serif";
  ctx.textAlign = "right";
  ctx.lineWidth = 1;

  for(let i=0;i<=5;i++){
    const value = max - range * i / 5;
    const y = getY(value);

    ctx.strokeStyle = "#ddd";
    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(graphWidth-right,y);
    ctx.stroke();

    ctx.fillStyle = "#666";
    ctx.fillText(
      "¥" + Math.round(value).toLocaleString(),
      left - 7,
      y + 4
    );
  }

  if(min <= 0 && max >= 0){
    const y = getY(0);

    ctx.strokeStyle = "#aaa";
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(graphWidth-right,y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.strokeStyle = "#333";
  ctx.lineWidth = 3;
  ctx.beginPath();

  values.forEach((value,i)=>{
    const x = getX(i);
    const y = getY(value);

    if(i === 0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.stroke();

  values.forEach((value,i)=>{
    const x = getX(i);
    const y = getY(value);

    ctx.beginPath();
    ctx.arc(x,y,5,0,Math.PI*2);

    ctx.fillStyle =
      i === 0

      : records[i-1].type === "income"

        : "#d00000";

    ctx.fill();
  });

  const last = values.length - 1;

  ctx.fillStyle = "#333";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";

  ctx.fillText(
    "¥" + values[last].toLocaleString(),

    getY(values[last]) - 10
  );

  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#666";

  md.max=Math.max(md.max,bal());
  if(bal()>before)md.newHigh=true;

  /* 一度解除した実績は、その月の間は解除済みのまま */

      md.done[i]=true;

  /* 20個以上の実績を解除したら「今月の達人」も解除 */
  const achievedCount=Object.keys(md.done).filter(i=>+i<29).length;
  if(!md.done[29]&&achievedCount>=20){
    md.done[29]=true;

  showAch();

<script>
/* ===== コイン＆木（追加機能） ===== */
(function(){
  const CK="okodukaiCoinData";
  const TK="okodukaiTreeData";

  let coin=JSON.parse(localStorage.getItem(CK)||"{}");
  coin.balance=Number.isFinite(Number(coin.balance))?Number(coin.balance):0;
  coin.totalEarned=Number.isFinite(Number(coin.totalEarned))?Number(coin.totalEarned):0;
  coin.loginDays=Array.isArray(coin.loginDays)?coin.loginDays:[];
  coin.noExpenseDays=Array.isArray(coin.noExpenseDays)?coin.noExpenseDays:[];

  let tree=JSON.parse(localStorage.getItem(TK)||"{}");
  tree.spent=Number.isFinite(Number(tree.spent))?Number(tree.spent):0;
  tree.growthCount=Number.isFinite(Number(tree.growthCount))?Number(tree.growthCount):0;

  const stages=[
    ["🌱","🌱 種",0],
    ["🌿","🌿 芽",500],
    ["🪴","🪴 小さな木",1000],
    ["🌳","🌳 木",2500],
    ["🌳✨","🌳✨ 大きな木",5000],
    ["🌲","🌲 立派な木",10000],
    ["🌳🏆","🌳🏆 大樹",20000]
  ];
  const MAX=20000;

  function saveCoin(){localStorage.setItem(CK,JSON.stringify(coin))}
  function saveTree(){localStorage.setItem(TK,JSON.stringify(tree))}
  function award(n){coin.balance+=n;coin.totalEarned+=n;saveCoin()}

  function dateKey(d){
    return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();
  }
  const today=dateKey(new Date());

  // 1日1回ログインで50コイン
  if(!coin.loginDays.includes(today)){
    coin.loginDays.push(today);
    award(50);
    const log=document.getElementById("coinLog");
    if(log) log.textContent="🎉 今日のログインボーナス！ +50コイン";
  }

  // 支出しなかった「記録済みの日」を一度だけ判定
  // 既存の履歴を壊さず、現在の履歴から判定する。
  try{
    const rs=JSON.parse(localStorage.getItem("okodukaiRecords")||"[]");
    const days={};
    rs.forEach(r=>{
      const d=r.date || "";
      if(d) days[d] ||= {expense:false};
      if(d && r.type==="expense") days[d].expense=true;
    });
    Object.keys(days).forEach(d=>{
      if(!days[d].expense && !coin.noExpenseDays.includes(d)){
        coin.noExpenseDays.push(d);
        award(100);
      }
    });
  }catch(e){}

  function renderTree(){
    const stage=stages.reduce((best,x)=>tree.spent>=x[2]?x:best,stages[0]);
    const next=stages.find(x=>x[2]>tree.spent);
    const view=document.getElementById("treeView");
    const name=document.getElementById("treeStage");
    const progress=document.getElementById("treeProgress");
    const text=document.getElementById("treeProgressText");
    const reset=document.getElementById("treeResetButton");
    const cb=document.getElementById("coinBalance");
    const ce=document.getElementById("coinTotalEarned");
    const gc=document.getElementById("treeGrowthCount");

    if(cb) cb.textContent=coin.balance.toLocaleString()+"コイン";
    if(ce) ce.textContent=coin.totalEarned.toLocaleString()+"コイン";
    if(gc) gc.textContent=tree.growthCount+"回";
    if(view) view.textContent=stage[0];
    if(name) name.textContent=stage[1];

    if(tree.spent>=MAX){
      if(progress) progress.style.width="100%";
      if(text) text.textContent="🎉 木が最大まで成長しました！";
      if(reset) reset.style.display="block";
    }else{
      const nextCost=next[2];
      const prevCost=stage[2];
      const pct=((tree.spent-prevCost)/(nextCost-prevCost))*100;
      if(progress) progress.style.width=Math.max(0,Math.min(100,pct))+"%";
      if(text) text.textContent="次の成長まで "+Math.max(0,nextCost-tree.spent).toLocaleString()+"コイン";
      if(reset) reset.style.display="none";
    }
    saveTree();
  }

  window.useTreeCoins=function(){
    if(tree.spent>=MAX){
      alert("木はすでに最大まで成長しています。");
      return;
    }

    const next=stages.find(x=>x[2]>tree.spent);
    if(!next)return;

    const need=next[2]-tree.spent;

    if(coin.balance<need){
      alert("コインが足りません。あと"+(need-coin.balance).toLocaleString()+"コイン必要です。");
      return;
    }

    coin.balance-=need;
    tree.spent+=need;

    /*
     * 変更点②
     * コインを使って木が1段階成長するたびに
     * 成長回数を1回増やす。
     *
     * 最大まで育った後のリセットでは増やさない。
     */
    tree.growthCount++;

    saveCoin();
    saveTree();
    renderTree();
  };

  window.resetTree=function(){
    if(tree.spent<MAX)return;

    if(!confirm("最大まで育った木をリセットしますか？\n成長回数は記録として残ります。"))return;

    /*
     * リセットでは成長回数を増やさない。
     * 成長回数は「1段階成長した回数」を記録する。
     */
    tree.spent=0;

    saveTree();
    renderTree();
  };

  renderTree();

  // 「支出しなかった日」の判定を、履歴追加後にも更新
  const oldAddMoney=window.addMoney;
  if(typeof oldAddMoney==="function"){
    window.addMoney=function(){
      oldAddMoney.apply(this,arguments);

      try{
        const rs=JSON.parse(localStorage.getItem("okodukaiRecords")||"[]");
        const days={};

        rs.forEach(r=>{
          const d=r.date||"";
          if(d) days[d] ||= false;
          if(d && r.type==="expense") days[d]=true;
        });

        Object.keys(days).forEach(d=>{
          if(!days[d]&&!coin.noExpenseDays.includes(d)){
            coin.noExpenseDays.push(d);
            award(100);
          }
        });

        renderTree();
      }catch(e){}
    };
  }

  /*
   * ============================================================
   * 変更点①
   * 「買った！」を押したとき、購入済みにするだけではなく、
   * その金額を正式な支出履歴として追加する。
   * ============================================================
   */
  window.buyWish=function(i){
    const w=wishes[i];

    if(!w)return;

    if(confirm("「"+w.name+"」を買ったことにしますか？")){
      const price=moneyValue(w.price);

      /*
       * 欲しいものの購入を支出として記録。
       * これにより残高・履歴・グラフにも反映される。
       */
      records.push({
        type:"expense",
        name:w.name,
        amount:price,
        date:new Date().toLocaleDateString("ja-JP"),
        ts:Date.now()
      });

      w.bought=true;
      w.boughtDate=new Date().toLocaleDateString("ja-JP");

      save();
      render();
      check();
    }
  };

})();
</script>

</body></html>
