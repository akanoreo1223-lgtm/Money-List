<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お小遣い帳</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .balance {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #ccc;
    }

    .balance h2 {
      margin: 0;
      color: #555;
      font-size: 18px;
    }

    #balance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    .form,
    .history,
    .wishlist {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #ccc;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }

    .income {
      color: #008000;
      font-weight: bold;
    }

    .expense {
      color: #d00000;
      font-weight: bold;
    }

    .delete {
      width: auto;
      padding: 5px 10px;
      margin: 0 0 0 10px;
      background: #999;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #888;
    }

    .wish-price {
      font-weight: bold;
      margin-right: 5px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💰 お小遣い帳</h1>

    <!-- 残高 -->
    <div class="balance">
      <h2>現在の残高</h2>
      <div id="balance">¥0</div>
    </div>

    <!-- 収入・支出 -->
    <div class="form">

      <select id="type">
        <option value="income">収入</option>
        <option value="expense">支出</option>
      </select>

      <input
        type="text"
        id="name"
        placeholder="内容（例：お小遣い、ゲームなど）"
      >

      <input
        type="number"
        id="amount"
        placeholder="金額"
        min="1"
      >

      <button onclick="addMoney()">追加する</button>

    </div>

    <!-- 履歴 -->
    <div class="history">
      <h2>📋 履歴</h2>
      <div id="history"></div>
    </div>

    <!-- 欲しいものリスト -->
    <div class="wishlist">

      <h2>🎁 欲しいものリスト</h2>

      <input
        type="text"
        id="wishName"
        placeholder="欲しいもの（例：ゲームソフト）"
      >

      <input
        type="number"
        id="wishPrice"
        placeholder="値段"
        min="1"
      >

      <button onclick="addWish()">欲しいものを追加</button>

      <div id="wishlist"></div>

    </div>

  </div>

  <script>

    /* =========================
       お小遣い帳
       ========================= */

    let records =
      JSON.parse(localStorage.getItem("okodukaiRecords")) || [];

    // お金を追加
    function addMoney() {

      const type =
        document.getElementById("type").value;

      const name =
        document.getElementById("name").value;

      const amount =
        Number(document.getElementById("amount").value);

      if (name === "" || amount <= 0) {
        alert("内容と金額を入力してください。");
        return;
      }

      const record = {
        type: type,
        name: name,
        amount: amount,
        date: new Date().toLocaleDateString("ja-JP")
      };

      records.push(record);

      saveData();
      display();

      document.getElementById("name").value = "";
      document.getElementById("amount").value = "";
    }

    // データを保存
    function saveData() {

      localStorage.setItem(
        "okodukaiRecords",
        JSON.stringify(records)
      );

    }

    // 履歴と残高を表示
    function display() {

      let balance = 0;

      records.forEach(record => {

        if (record.type === "income") {
          balance += record.amount;
        } else {
          balance -= record.amount;
        }

      });

      document.getElementById("balance").textContent =
        "¥" + balance.toLocaleString();

      const history =
        document.getElementById("history");

      if (records.length === 0) {

        history.innerHTML =
          '<p class="empty">まだ記録がありません。</p>';

        return;
      }

      history.innerHTML = "";

      [...records].reverse().forEach((record, index) => {

        const div =
          document.createElement("div");

        div.className = "item";

        const realIndex =
          records.length - 1 - index;

        const sign =
          record.type === "income" ? "+" : "-";

        const className =
          record.type === "income"
            ? "income"
            : "expense";

        div.innerHTML = `

          <div>
            <small>${record.date}</small><br>
            ${record.name}
          </div>

          <div>

            <span class="${className}">
              ${sign}¥${record.amount.toLocaleString()}
            </span>

            <button
              class="delete"
              onclick="deleteRecord(${realIndex})"
            >
              削除
            </button>

          </div>

        `;

        history.appendChild(div);

      });

    }

    // 記録を削除
    function deleteRecord(index) {

      if (confirm("この記録を削除しますか？")) {

        records.splice(index, 1);

        saveData();
        display();

      }

    }


    /* =========================
       欲しいものリスト
       ========================= */

    let wishes =
      JSON.parse(localStorage.getItem("okodukaiWishes")) || [];

    // 欲しいものを追加
    function addWish() {

      const name =
        document.getElementById("wishName").value;

      const price =
        Number(document.getElementById("wishPrice").value);

      if (name === "" || price <= 0) {

        alert("欲しいものと値段を入力してください。");
        return;

      }

      const wish = {

        name: name,
        price: price

      };

      wishes.push(wish);

      saveWishes();
      displayWishes();

      document.getElementById("wishName").value = "";
      document.getElementById("wishPrice").value = "";

    }

    // 欲しいものを保存
    function saveWishes() {

      localStorage.setItem(
        "okodukaiWishes",
        JSON.stringify(wishes)
      );

    }

    // 欲しいものを表示
    function displayWishes() {

      const list =
        document.getElementById("wishlist");

      if (wishes.length === 0) {

        list.innerHTML =
          '<p class="empty">まだ欲しいものがありません。</p>';

        return;

      }

      list.innerHTML = "";

      wishes.forEach((wish, index) => {

        const div =
          document.createElement("div");

        div.className = "item";

        div.innerHTML = `

          <div>
            🎁 ${wish.name}
          </div>

          <div>

            <span class="wish-price">
              ¥${wish.price.toLocaleString()}
            </span>

            <button
              class="delete"
              onclick="deleteWish(${index})"
            >
              削除
            </button>

          </div>

        `;

        list.appendChild(div);

      });

    }

    // 欲しいものを削除
    function deleteWish(index) {

      if (confirm("この欲しいものを削除しますか？")) {

        wishes.splice(index, 1);

        saveWishes();
        displayWishes();

      }

    }


    /* =========================
       最初に表示
       ========================= */

    display();
    displayWishes();

  </script>

</body>
</html>
